<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#1b4d3e" />
    <meta
      name="description"
      content="Confirmação de conta concluída no SubTrack."
    />
    <title>Conta verificada com sucesso! — SubTrack</title>
    <link
      rel="canonical"
      href="https://subtrackbr.com.br/conta-verificada.html"
    />
    <link
      rel="icon"
      type="image/png"
      href="assets/subtrack-app-icon-1024.png"
    />
    <link rel="stylesheet" href="styles.css?v=5" />
  </head>
  <body class="verification-page">
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

    <main id="conteudo" class="verification-main" tabindex="-1">
      <section class="verification-card" aria-labelledby="titulo-confirmacao">
        <div class="brand-lockup verification-brand">
          <img
            class="brand-mark"
            src="assets/subtrack-symbol.svg?v=4"
            width="20"
            height="27"
            alt=""
            aria-hidden="true"
          />
          <span class="brand-name">SubTrack</span>
        </div>

        <div class="verification-success-icon" aria-hidden="true">
          <span></span>
        </div>

        <h1 id="titulo-confirmacao">Conta verificada com sucesso!</h1>
        <p class="verification-message">
          Seu e-mail foi confirmado. Agora você já pode voltar ao SubTrack e
          entrar na sua conta.
        </p>
        <p class="verification-note">
          Você já concluiu esta etapa e não precisa fazer mais nada neste site.
        </p>

        <a class="button button-primary verification-action" href="/">
          Conhecer o SubTrack
        </a>
      </section>
    </main>
  </body>
</html>
